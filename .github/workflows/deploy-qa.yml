name: Compilar y publicar APK QA

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: appmovil-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, Linux, X64, tuval-appmovil-pruebas]
    timeout-minutes: 20
    outputs:
      qa_version: ${{ steps.version.outputs.qa_version }}
    steps:
      - name: Calcular siguiente versión QA en pruebas
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ $(hostname -s) == srv-web02 ]]
          exec 9>/var/lib/tuval-runner/deploy.lock
          flock -w 900 9
          cd /var/www/webtuval
          version=$(php artisan app:siguiente-version-qa --no-interaction)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "qa_version=$version" >> "$GITHUB_OUTPUT"
          echo "Versión a compilar: $version-qa"

  build:
    needs: prepare
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Instalar dependencias bloqueadas
        run: flutter pub get --enforce-lockfile
      - name: Analizar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Ejecutar pruebas
        shell: bash
        run: |
          if find test -name '*_test.dart' -type f -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo '::notice::El repositorio aún no contiene pruebas Flutter.'
          fi
      - name: Compilar QA y preparar manifiesto
        env:
          GH_TOKEN: ${{ github.token }}
          QA_VERSION: ${{ needs.prepare.outputs.qa_version }}
        shell: bash
        run: bash scripts/build-qa.sh
      - name: Guardar compilación para el servidor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk-qa-${{ github.sha }}-${{ github.run_id }}
          path: dist/qa/
          overwrite: true
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: build
    runs-on: [self-hosted, Linux, X64, tuval-appmovil-pruebas]
    timeout-minutes: 25
    steps:
      - name: Descargar compilación de esta ejecución
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk-qa-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/appmovil-qa-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Firmar, registrar y verificar en pruebas
        env:
          GH_TOKEN: ${{ github.token }}
          APK_ARTIFACT_DIR: ${{ runner.temp }}/appmovil-qa-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash /var/www/webtuval/scripts/publicar-apk-pruebas.sh "$APK_ARTIFACT_DIR"
      - name: Limpiar artefacto temporal
        if: always()
        env:
          APK_ARTIFACT_DIR: ${{ runner.temp }}/appmovil-qa-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$APK_ARTIFACT_DIR"
